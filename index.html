<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinPlanner Prototype</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for graphs and pie charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS for reading CSV/Excel files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Local styles moved to styles.css -->
    <link rel="stylesheet" href="styles.css">
     <!-- Google Fonts for a modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-200">

    <!-- App containers will be populated by JavaScript -->
    <div id="auth-container" class="min-h-screen flex items-center justify-center p-4"></div>
    <div id="app-container" class="hidden relative min-h-screen lg:flex"></div>
    <div id="modal-container" class="hidden fixed inset-0 z-50"></div>
    <!-- Notification Bar -->
    <div id="notification-bar" class="fixed top-0 left-1/2 -translate-x-1/2 p-4 rounded-b-lg shadow-lg text-white text-center z-[100] transform -translate-y-full"></div>


    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // ========================================================================
            // 1. "DATABASE" (localStorage) & CORE LOGIC
            // ========================================================================
            
            const db = {
                init() {
                    if (!localStorage.getItem('finPlannerDB')) {
                        const cleanDB = {
                            users: { 
                                "example@gmail.com": { name: "Sample User", password: "password123" },
                                "user2@example.com": { name: "Another User", password: "password456" }
                            },
                            data: { 
                                "example@gmail.com": { transactions: [], goals: [], investments: [], plannerEvents: [] },
                                "user2@example.com": { transactions: [], goals: [], investments: [], plannerEvents: [] }
                            }
                        };
                        localStorage.setItem('finPlannerDB', JSON.stringify(cleanDB));
                    }
                },
                getDB() { return JSON.parse(localStorage.getItem('finPlannerDB')); },
                saveDB(database) { localStorage.setItem('finPlannerDB', JSON.stringify(database)); },
                getUserData(email) {
                    const database = this.getDB();
                    if (!database.data[email]) {
                        database.data[email] = { transactions: [], goals: [], investments: [], plannerEvents: [] };
                        this.saveDB(database);
                    }
                    return database.data[email];
                },
                saveUserData(email, userData) {
                    const database = this.getDB();
                    database.data[email] = userData;
                    this.saveDB(database);
                },
                getUsers() { return this.getDB().users; },
                addUser(name, email, password) {
                    const database = this.getDB();
                    if(database.users[email]) return false;
                    database.users[email] = { name, password };
                    this.saveDB(database);
                    this.getUserData(email);
                    return true;
                }
            };

            // ========================================================================
            // 2. STATE & AUTHENTICATION
            // ========================================================================

            const state = { currentUser: null, currentPage: 'Dashboard' };

            const auth = {
                login(email, password) { const user = db.getUsers()[email]; if (user && user.password === password) { state.currentUser = email; sessionStorage.setItem('finPlannerUser', email); return true; } return false; },
                register(name, email, password) { if(db.addUser(name, email, password)) { return this.login(email, password); } return false; },
                logout() { state.currentUser = null; sessionStorage.removeItem('finPlannerUser'); renderApp(); },
                checkSession() { state.currentUser = sessionStorage.getItem('finPlannerUser'); }
            };

            // ========================================================================
            // 3. API (Data Manipulation)
            // ========================================================================

            const api = {
                addItem(itemType, itemData) {
                    let userData = db.getUserData(state.currentUser);
                    itemData.id = Date.now() + Math.random();

                    if (itemType === 'plannerEvents') {
                        itemData.done = false;
                    }
                    
                    if (itemType === 'transactions') {
                        const categoryValue = itemData.category;
                        if (itemData.status === 'Complete') {
                            if (categoryValue.startsWith('goal-')) {
                                const goalId = Number(categoryValue.split('-')[1]);
                                const goal = userData.goals.find(g => g.id === goalId);
                                if (goal) {
                                    goal.saved = Number(goal.saved) + Number(itemData.amount);
                                    itemData.category = `Goal: ${goal.name}`;
                                    itemData.type = 'expense';
                                }
                            } else if (categoryValue.startsWith('investment-')) {
                                const investmentId = Number(categoryValue.split('-')[1]);
                                const investment = userData.investments.find(i => i.id === investmentId);
                                if (investment) {
                                    investment.amount = Number(investment.amount) + Number(itemData.amount);
                                    itemData.category = `Invest: ${investment.name}`;
                                    itemData.type = 'expense';
                                }
                            }
                        } else if (categoryValue.startsWith('goal-') || categoryValue.startsWith('investment-')) {
                             itemData.category = "General Savings"; 
                        }
                    }

                    const collection = userData[itemType] || [];
                    collection.unshift(itemData);
                    userData[itemType] = collection;
                    db.saveUserData(state.currentUser, userData);
                },
                addMultipleTransactions(transactions) {
                    const userData = db.getUserData(state.currentUser);
                    const collection = userData.transactions || [];
                    const newTransactions = transactions.map(t => ({...t, id: Date.now() + Math.random()}));
                    userData.transactions = [...newTransactions, ...collection];
                    db.saveUserData(state.currentUser, userData);
                },
                togglePlannerEventDone(eventId) {
                    const userData = db.getUserData(state.currentUser);
                    const event = userData.plannerEvents.find(e => e.id === eventId);
                    if (event) {
                        event.done = !event.done;
                        db.saveUserData(state.currentUser, userData);
                    }
                },
                resetUserData() {
                    const userData = db.getUserData(state.currentUser);
                    userData.transactions = [];
                    userData.goals = [];
                    userData.investments = [];
                    userData.plannerEvents = [];
                    db.saveUserData(state.currentUser, userData);
                }
            };
            
            // ========================================================================
            // 4. HELPERS (Charts, Notifications, Gemini)
            // ========================================================================

            const helpers = {
                destroyChart(canvasId) {
                    const existingChart = Chart.getChart(canvasId);
                    if (existingChart) existingChart.destroy();
                },
                renderPieChart(canvasId, transactions) {
                    const completedTransactions = transactions.filter(t => t.status === 'Complete');
                    this.destroyChart(canvasId); const canvas = document.getElementById(canvasId); const placeholder = document.getElementById(`${canvasId}-placeholder`); if (!canvas || !placeholder) return; const expenseData = completedTransactions.filter(t => t.type === 'expense').reduce((acc, t) => { acc[t.category] = (acc[t.category] || 0) + Number(t.amount); return acc; }, {}); if (Object.keys(expenseData).length === 0) { canvas.style.display = 'none'; placeholder.style.display = 'flex'; return; } canvas.style.display = 'block'; placeholder.style.display = 'none'; new Chart(canvas.getContext('2d'), { type: 'doughnut', data: { labels: Object.keys(expenseData), datasets: [{ data: Object.values(expenseData), backgroundColor: ['#34D399', '#F87171', '#60A5FA', '#FBBF24', '#A78BFA', '#EC4899'], borderColor: '#1f2937', borderWidth: 2, }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#d1d5db', boxWidth: 12, padding: 20 } } } } });
                },
                renderLineChart(canvasId, transactions) {
                    const completedTransactions = transactions.filter(t => t.status === 'Complete');
                    this.destroyChart(canvasId); const canvas = document.getElementById(canvasId); const placeholder = document.getElementById(`${canvasId}-placeholder`); if (!canvas || !placeholder) return; if (completedTransactions.length === 0) { canvas.style.display = 'none'; placeholder.style.display = 'flex'; return; } canvas.style.display = 'block'; placeholder.style.display = 'none'; const sorted = [...completedTransactions].sort((a,b) => new Date(a.date) - new Date(b.date)); const labels = [...new Set(sorted.map(t => new Date(t.date).toLocaleDateString()))]; const incomeData = {}, expenseData = {}; sorted.forEach(t => { const date = new Date(t.date).toLocaleDateString(); if (t.type === 'income') incomeData[date] = (incomeData[date] || 0) + Number(t.amount); if (t.type === 'expense') expenseData[date] = (expenseData[date] || 0) + Number(t.amount); }); new Chart(canvas.getContext('2d'), { type: 'line', data: { labels, datasets: [ { label: 'Income', data: labels.map(l => incomeData[l] || 0), borderColor: '#34D399', backgroundColor: '#34D399', tension: 0.2, fill: false }, { label: 'Expense', data: labels.map(l => expenseData[l] || 0), borderColor: '#F87171', backgroundColor: '#F87171', tension: 0.2, fill: false } ] }, options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { color: '#9ca3af' }, grid: { color: '#374151' } }, y: { ticks: { color: '#9ca3af' }, grid: { color: '#374151' } } }, plugins: { legend: { labels: { color: '#d1d5db' } } } } });
                },
                showNotification(message, type = 'info') {
                    const bar = document.getElementById('notification-bar');
                    bar.textContent = message;
                    const colors = { info: 'bg-blue-600', success: 'bg-green-600', warning: 'bg-yellow-600', error: 'bg-red-600' };
                    bar.className = `fixed top-0 left-1/2 -translate-x-1/2 p-4 rounded-b-lg shadow-lg text-white text-center z-[100] transform -translate-y-full ${colors[type]}`;
                    bar.style.transform = 'translate(-50%, 20%)';
                    setTimeout(() => { bar.style.transform = 'translate(-50%, -100%)'; }, 4000);
                },
                async getAIFinancialReport() {
                    const reportContainer = document.getElementById('ai-report-container');
                    if (!reportContainer) return;
                    reportContainer.innerHTML = `<div class="text-center text-gray-400">✨ Generating your financial report...</div>`;
                    const userData = db.getUserData(state.currentUser);
                    if (userData.transactions.length === 0) {
                         reportContainer.innerHTML = `<div class="bg-gray-800 p-6 rounded-lg text-center text-gray-400">Add some transactions to get your first AI-powered financial report.</div>`;
                         return;
                    }
                    const totalIncome = userData.transactions.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);
                    const totalExpense = userData.transactions.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
                    const expenseBreakdown = userData.transactions.filter(t => t.type === 'expense').reduce((acc, t) => { acc[t.category] = (acc[t.category] || 0) + Number(t.amount); return acc; }, {});
                    const prompt = `Act as a friendly financial analyst...`;
                    try {
                        // IMPORTANT: Paste your Google Gemini API Key here for the AI features to work.
                        // Get a free key from https://aistudio.google.com/
                        const apiKey = "AIzaSyBKVkEO9cS_OMqDB4H-Qhzj5XkMPCvbnA0"; 
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;
                        const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
                        if (!response.ok) throw new Error(`API error: ${response.statusText}`);
                        const result = await response.json();
                        const reportText = result.candidates[0].content.parts[0].text;
                        const formattedReport = reportText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
                        reportContainer.innerHTML = `<div class="bg-gray-800 p-6 rounded-lg prose prose-invert max-w-none">${formattedReport}</div>`;
                    } catch (error) {
                        console.error('Gemini API Error:', error);
                        reportContainer.innerHTML = `<div class="bg-red-900/50 p-6 rounded-lg text-center text-red-300">Sorry, there was an error generating your report. Please try again later.</div>`;
                    }
                },
                 async getAIGoalPlan(userInput) {
                    const prompt = `You are a helpful financial planning assistant...`;
                    try {
                        // IMPORTANT: Paste your Google Gemini API Key here for the AI features to work.
                        // Get a free key from https://aistudio.google.com/
                        const apiKey = "PASTE_YOUR_API_KEY_HERE"; 
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;
                        const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
                        if (!response.ok) throw new Error(`API error: ${response.statusText}`);
                        const result = await response.json();
                        const jsonText = result.candidates[0].content.parts[0].text;
                        return JSON.parse(jsonText);
                    } catch (error) {
                        console.error('Gemini API Error:', error);
                        return null;
                    }
                }
            };

            // ========================================================================
            // 5. HTML TEMPLATES
            // ========================================================================
            
            const templates = {
                mainAppShell(userName) { const icons = { Dashboard: `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>`, Transactions: `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4h16M4 8h16M4 12h16M4 16h16"/>`, Goals: `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6H8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9"/>`, Investments: `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>`, Planner: `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>`, Reports: `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>`, Insights: `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />`}; const navLinks = Object.keys(icons).map(page => `<a href="#" data-page="${page}" class="nav-link flex items-center px-4 py-3 rounded-lg"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">${icons[page]}</svg><span class="ml-4">${page}</span></a>`).join(''); return `<div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div><aside id="sidebar" class="w-64 bg-gray-800 p-6 flex-shrink-0 flex flex-col justify-between h-full fixed top-0 left-0 z-40 transform -translate-x-full lg:translate-x-0 lg:sticky"><div><h1 class="text-2xl font-bold text-white mb-10">FinPlanner</h1><nav id="main-nav" class="space-y-2">${navLinks}</nav></div><div><button id="logout-button" class="w-full text-left flex items-center px-4 py-3 rounded-lg text-gray-400 hover:bg-gray-700 hover:text-white"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg><span class="ml-4">Logout</span></button><div class="mt-2 border-t border-gray-700 pt-2"><button id="reset-data-button" class="w-full text-left flex items-center px-4 py-3 rounded-lg text-gray-400 hover:bg-red-900/50 hover:text-red-300"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg><span class="ml-4">Reset Data</span></button><p class="text-xs text-gray-600 px-4 mt-1">Deletes all user data.</p></div></div></aside><main class="flex-1 w-full p-4 sm:p-8 overflow-y-auto h-screen"><header class="grid grid-cols-3 items-center mb-8 lg:flex lg:justify-between"><div class="justify-self-start"><button id="menu-toggle-btn" class="lg:hidden p-2 rounded-md hover:bg-gray-700"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg></button></div><h2 id="page-title" class="text-xl sm:text-3xl font-bold text-white text-center truncate lg:text-left"></h2><div class="justify-self-end"><div class="flex items-center gap-3 bg-gray-800 p-2 rounded-full"><div class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center"><svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg></div><span class="text-gray-300 font-medium hidden sm:block">${userName}</span></div></div></header><div id="page-container"></div></main>`; },
                loginPage: () => `<div class="max-w-md w-full bg-gray-800 p-8 rounded-xl shadow-lg"> <h1 class="text-3xl font-bold text-white text-center mb-6">FinPlanner Login</h1> <form id="login-form"> <div class="space-y-4"> <input type="email" id="login-email" required placeholder="Email" class="w-full bg-gray-700 p-3 rounded-lg"> <input type="password" id="login-password" required placeholder="Password" class="w-full bg-gray-700 p-3 rounded-lg"> </div> <div id="login-error" class="text-red-400 text-sm mt-4 text-center h-5"></div> <button type="submit" class="w-full mt-4 bg-teal-600 p-3 rounded-lg font-semibold hover:bg-teal-700">Sign In</button> </form> <p class="mt-6 text-center text-sm">Don't have an account? <a href="#" id="show-register" class="text-teal-400 hover:underline">Sign Up</a></p> <div class="mt-8 border-t border-yellow-500/30 pt-4"> <div class="border border-yellow-500/50 bg-yellow-900/20 p-3 rounded-lg text-sm"> <h4 class="font-bold text-yellow-300 mb-2 text-center">Note: Sample IDs for Testing</h4> <ol class="list-decimal list-inside text-gray-400 font-mono text-xs space-y-1 w-fit mx-auto"> <li>ID: example@gmail.com, Pass: password123</li> <li>ID: user2@example.com, Pass: password456</li> </ol> </div> </div> </div>`,
                registerPage: () => `<div class="max-w-md w-full bg-gray-800 p-8 rounded-xl shadow-lg"><h1 class="text-3xl font-bold text-white text-center mb-6">Create Account</h1><form id="register-form"><div class="space-y-4"><input type="text" id="register-name" required placeholder="Full Name" class="w-full bg-gray-700 p-3 rounded-lg"><input type="email" id="register-email" required placeholder="Email" class="w-full bg-gray-700 p-3 rounded-lg"><input type="password" id="register-password" required placeholder="Password" class="w-full bg-gray-700 p-3 rounded-lg"></div><div id="register-error" class="text-red-400 text-sm mt-4 text-center h-5"></div><button type="submit" class="w-full mt-4 bg-teal-600 p-3 rounded-lg font-semibold hover:bg-teal-700">Sign Up</button></form><p class="mt-6 text-center text-sm">Already have an account? <a href="#" id="show-login" class="text-teal-400 hover:underline">Sign In</a></p></div>`,
                dashboardPage(data) { const completedTx = data.transactions.filter(t => t.status === 'Complete'); const totalBalance = completedTx.reduce((acc, t) => acc + (t.type === 'income' ? Number(t.amount) : -Number(t.amount)), 0); const goalProgressHtml = data.goals.length > 0 ? data.goals.map(g => { const percentage = g.target > 0 ? (Number(g.saved) / Number(g.target)) * 100 : 0; return `<div><div class="flex justify-between mb-1 text-sm"><span class="font-semibold text-gray-300">${g.name}</span><span class="text-gray-400">₹${Number(g.saved).toFixed(0)} / ₹${Number(g.target).toFixed(0)}</span></div><div class="w-full bg-gray-700 rounded-full h-2"><div class="bg-indigo-500 h-2 rounded-full" style="width: ${Math.min(percentage, 100)}%"></div></div></div>`; }).join('') : '<p class="text-sm text-gray-500">No goals set yet.</p>'; const upcomingEvents = data.plannerEvents.filter(e => !e.done).sort((a,b) => new Date(a.date) - new Date(b.date)).slice(0, 5); const plannerHtml = upcomingEvents.length > 0 ? upcomingEvents.map(e => `<div class="flex items-center justify-between py-2 border-b border-gray-700/50"><label for="task-${e.id}" class="flex items-center cursor-pointer"><input type="checkbox" id="task-${e.id}" data-id="${e.id}" class="planner-checkbox h-4 w-4 bg-gray-700 border-gray-600 rounded text-teal-500 focus:ring-teal-500 mr-3"><span class="text-gray-300">${e.title}</span></label><span class="text-xs text-gray-500">${new Date(e.date).toLocaleDateString('en-GB', {day: '2-digit', month: 'short'})}</span></div>`).join('') : '<p class="text-sm text-gray-500">No upcoming events.</p>'; return `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"><div class="bg-gray-800 p-6 rounded-lg"><h3 class="text-gray-400">Total Balance</h3><p class="text-3xl font-bold">₹${totalBalance.toFixed(2)}</p></div><div class="bg-gray-800 p-6 rounded-lg"><h3 class="text-gray-400">Income</h3><p class="text-3xl font-bold text-green-400">₹${completedTx.filter(t => t.type === 'income').reduce((sum, t) => sum + Number(t.amount), 0).toFixed(2)}</p></div><div class="bg-gray-800 p-6 rounded-lg"><h3 class="text-gray-400">Expenses</h3><p class="text-3xl font-bold text-red-400">₹${completedTx.filter(t => t.type === 'expense').reduce((sum, t) => sum + Number(t.amount), 0).toFixed(2)}</p></div><div class="bg-gray-800 p-6 rounded-lg"><h3 class="text-gray-400">Savings Goals</h3><p class="text-3xl font-bold">${data.goals.length}</p></div></div><div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6"><div class="space-y-6"><div class="bg-gray-800 p-6 rounded-lg h-96 relative"><h3 class="text-lg font-semibold mb-4">Income vs Expense Trend</h3><div id="dashboard-line-chart-placeholder" class="h-full w-full flex items-center justify-center text-gray-500">No transaction data</div><canvas id="dashboard-line-chart"></canvas></div><div class="bg-gray-800 p-6 rounded-lg"><h3 class="text-lg font-semibold mb-4">Goal Progress</h3><div class="space-y-4">${goalProgressHtml}</div></div></div><div class="space-y-6"><div class="bg-gray-800 p-6 rounded-lg h-96 relative"><h3 class="text-lg font-semibold mb-4">Expense Breakdown</h3><div id="dashboard-pie-chart-placeholder" class="h-full w-full flex items-center justify-center text-gray-500">No expense data</div><canvas id="dashboard-pie-chart"></canvas></div><div class="bg-gray-800 p-6 rounded-lg"><h3 class="text-lg font-semibold mb-4">Upcoming Events</h3><div class="space-y-2">${plannerHtml}</div></div></div></div>`; },
                reportsPage(data) { const completedTx = data.transactions.filter(t => t.status === 'Complete'); const incomeTx = completedTx.filter(t => t.type === 'income'); const expenseTx = completedTx.filter(t => t.type === 'expense'); const totalIncome = incomeTx.reduce((s, t) => s + Number(t.amount), 0); const totalExpense = expenseTx.reduce((s, t) => s + Number(t.amount), 0); const avgIncome = incomeTx.length > 0 ? totalIncome / incomeTx.length : 0; const avgExpense = expenseTx.length > 0 ? totalExpense / expenseTx.length : 0; const categorySummary = expenseTx.reduce((acc, t) => { if (!acc[t.category]) acc[t.category] = { total: 0, count: 0 }; acc[t.category].total += Number(t.amount); acc[t.category].count += 1; return acc; }, {}); const categoryRows = Object.entries(categorySummary).sort(([,a], [,b]) => b.total - a.total).map(([cat, {total, count}]) => `<tr><td class="p-3">${cat}</td><td class="p-3">${count}</td><td class="p-3 text-red-400">₹${total.toFixed(2)}</td></tr>`).join(''); return `<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8"><div class="bg-gray-800 p-6 rounded-lg"><h3 class="text-gray-400">Total Completed Transactions</h3><p class="text-3xl font-bold">${completedTx.length}</p></div><div class="bg-gray-800 p-6 rounded-lg"><h3 class="text-gray-400">Average Income</h3><p class="text-3xl font-bold text-green-400">₹${avgIncome.toFixed(2)}</p></div><div class="bg-gray-800 p-6 rounded-lg"><h3 class="text-gray-400">Average Expense</h3><p class="text-3xl font-bold text-red-400">₹${avgExpense.toFixed(2)}</p></div></div><div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8"><div class="bg-gray-800 p-6 rounded-lg"><h3 class="text-xl font-bold mb-4">Spending by Category</h3><table class="w-full text-left"><thead><tr><th class="p-3">Category</th><th class="p-3">Transactions</th><th class="p-3">Total Spent</th></tr></thead><tbody>${categoryRows}</tbody></table></div><div class="bg-gray-800 p-6 rounded-lg h-96 relative"><h3 class="text-xl font-bold mb-4">Expense Breakdown</h3><div id="reports-pie-chart-placeholder" class="h-full w-full items-center justify-center text-gray-500 hidden">No expense data</div><canvas id="reports-pie-chart"></canvas></div></div><div class="bg-gray-800 p-6 rounded-lg h-96 relative"><h3 class="text-xl font-bold mb-4">Cash Flow Over Time</h3><div id="reports-line-chart-placeholder" class="h-full w-full items-center justify-center text-gray-500 hidden">No transaction data</div><canvas id="reports-line-chart"></canvas></div>`;},
                transactionsPage(transactions) { const statusBadge = (status) => { const colors = { 'Complete': 'bg-green-500/20 text-green-400', 'Cancelled': 'bg-red-500/20 text-red-400', 'Pending': 'bg-yellow-500/20 text-yellow-400' }; return `<span class="px-2 py-1 text-xs font-medium rounded-full ${colors[status] || ''}">${status}</span>` }; const rows = transactions.map(t => `<tr class="border-b border-gray-700"><td class="p-3 text-sm text-gray-400">${new Date(t.date).toLocaleDateString()}<br>${t.transactionId || ''}</td><td class="p-3">${t.description}<br><span class="text-xs text-gray-500">${t.product || ''}</span></td><td class="p-3">${t.category}<br><span class="text-xs text-gray-500">${t.paymentMethod || ''}</span></td><td class="p-3 text-center">${statusBadge(t.status)}</td><td class="p-3 text-right ${t.type === 'income' ? 'text-green-400' : 'text-red-400'}">₹${Number(t.amount).toFixed(2)}</td></tr>`).join(''); return `<div class="bg-gray-800 p-6 rounded-lg"><div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4"><h2 class="text-2xl font-bold">Transactions</h2><div class="flex gap-4"><button id="import-excel-btn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 whitespace-nowrap">Import from Excel</button><button id="add-transaction-btn" class="bg-teal-500 text-white px-4 py-2 rounded-lg hover:bg-teal-600 whitespace-nowrap">Add Transaction</button></div></div><div class="overflow-x-auto"><table class="w-full text-left"><thead><tr class="border-b border-gray-600 text-sm text-gray-400"><th class="p-3">Date / ID</th><th class="p-3">Description / Product</th><th class="p-3">Category / Method</th><th class="p-3 text-center">Status</th><th class="p-3 text-right">Amount</th></tr></thead><tbody>${rows || `<tr><td colspan="5" class="text-center p-4 text-gray-500">No transactions found.</td></tr>`}</tbody></table></div></div>`; },
                goalsPage(goals) { const goalItems = goals.map(g => { const percentage = g.target > 0 ? (Number(g.saved) / Number(g.target)) * 100 : 0; return `<div class="bg-gray-700 p-4 rounded-lg"><div class="flex justify-between items-center mb-2"><h4 class="text-lg font-bold">${g.name}</h4><span class="text-sm text-gray-400">₹${Number(g.saved).toFixed(2)} / ₹${Number(g.target).toFixed(2)}</span></div><div class="w-full bg-gray-600 rounded-full h-2.5"><div class="bg-indigo-500 h-2.5 rounded-full" style="width: ${Math.min(percentage, 100)}%"></div></div></div>`}).join(''); return `<div class="bg-gray-800 p-6 rounded-lg"><div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold">Savings Goals</h2><div class="flex gap-4"><button id="plan-goal-ai-btn" class="bg-gradient-to-r from-purple-500 to-indigo-600 text-white font-bold py-2 px-4 rounded-lg shadow-lg hover:scale-105 transition-transform duration-200">✨ Plan Goal with AI</button><button id="add-goal-btn" class="bg-teal-500 text-white px-4 py-2 rounded-lg">Add Manually</button></div></div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${goalItems || '<p class="text-gray-500">No goals set.</p>'}</div></div>`; },
                investmentsPage(investments) { const rows = investments.map(i => `<tr class="border-b border-gray-700"><td class="p-3">${i.name}</td><td class="p-3">${i.type}</td><td class="p-3">₹${Number(i.amount).toFixed(2)}</td></tr>`).join(''); const totalInvested = investments.reduce((sum, i) => sum + Number(i.amount), 0); return `<div class="bg-gray-800 p-6 rounded-lg"><div class="flex justify-between items-center mb-6"><div><h2 class="text-2xl font-bold">Investments</h2><p class="text-gray-400">Total Invested: <span class="font-bold text-white">₹${totalInvested.toFixed(2)}</span></p></div><button id="add-investment-btn" class="bg-teal-500 text-white px-4 py-2 rounded-lg">Add Investment</button></div><table class="w-full text-left"><thead><tr class="border-b border-gray-600"><th class="p-3">Name</th><th class="p-3">Type</th><th class="p-3">Amount</th></tr></thead><tbody>${rows || `<tr><td colspan="3" class="text-center p-4 text-gray-500">No investments added.</td></tr>`}</tbody></table></div>`; },
                plannerPage(events) { const sortedEvents = [...events].sort((a,b) => new Date(a.date) - new Date(b.date)); const eventItems = sortedEvents.map(e => `<div class="bg-gray-700 p-4 rounded-lg flex items-center justify-between"><label for="task-${e.id}" class="flex items-center cursor-pointer flex-1"><input type="checkbox" id="task-${e.id}" data-id="${e.id}" class="planner-checkbox h-4 w-4 bg-gray-700 border-gray-600 rounded text-teal-500 focus:ring-teal-500 mr-3" ${e.done ? 'checked' : ''}><span class="text-gray-300 ${e.done ? 'line-through text-gray-500' : ''}">${e.title}</span></label><span class="text-sm ${e.done ? 'text-gray-600' : 'text-gray-500'}">${new Date(e.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long' })}</span></div>`).join(''); return `<div class="bg-gray-800 p-6 rounded-lg"><div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold">My Planner</h2><button id="add-planner-event-btn" class="bg-teal-500 text-white px-4 py-2 rounded-lg">Add Event</button></div><div class="space-y-4">${eventItems || '<p class="text-gray-500">No events scheduled.</p>'}</div></div>`; },
                insightsPage: () => `<div class="max-w-4xl mx-auto"><div class="text-center mb-8"><button id="get-ai-report-btn" class="bg-gradient-to-r from-purple-500 to-indigo-600 text-white font-bold py-3 px-6 rounded-lg shadow-lg hover:scale-105 transition-transform duration-200">✨ Get AI Financial Report</button></div><div id="ai-report-container"></div></div>`,
                modalShell: (title, form) => `<div class="modal-backdrop fixed inset-0 flex items-center justify-center"><div class="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-md">${title ? `<h3 class="text-2xl font-bold mb-6">${title}</h3>` : ''}${form}</div></div>`,
                addTransactionForm(userData) { const goalOptions = userData.goals.map(g => `<option value="goal-${g.id}">Goal: ${g.name}</option>`).join(''); const investmentOptions = userData.investments.map(i => `<option value="investment-${i.id}">Invest: ${i.name}</option>`).join(''); return `<form id="modal-form" class="space-y-4"><div class="grid grid-cols-2 gap-4"><input name="date" type="date" required class="col-span-2 w-full bg-gray-700 p-3 rounded-lg text-gray-400" value="${new Date().toISOString().slice(0,10)}"><input name="description" required placeholder="Description" class="w-full bg-gray-700 p-3 rounded-lg"><input name="product" placeholder="Product (optional)" class="w-full bg-gray-700 p-3 rounded-lg"></div><input name="transactionId" placeholder="Transaction ID (optional)" class="w-full bg-gray-700 p-3 rounded-lg"><div class="grid grid-cols-2 gap-4"><input name="amount" type="number" step="0.01" required placeholder="Amount" class="w-full bg-gray-700 p-3 rounded-lg"><select name="type" required class="w-full bg-gray-700 p-3 rounded-lg"><option value="expense">Expense</option><option value="income">Income</option></select></div><select name="category" required class="w-full bg-gray-700 p-3 rounded-lg"><optgroup label="Standard Categories"><option>Groceries</option><option>Bills</option><option>Salary</option><option>Entertainment</option><option>Other</option></optgroup><optgroup label="Goal Contributions">${goalOptions}</optgroup><optgroup label="Investment Contributions">${investmentOptions}</optgroup></select><div class="grid grid-cols-2 gap-4"><select name="paymentMethod" required class="w-full bg-gray-700 p-3 rounded-lg"><option>UPI</option><option>Credit Card</option><option>Debit Card</option><option>Net Banking</option><option>Cash</option></select><select name="status" required class="w-full bg-gray-700 p-3 rounded-lg"><option>Complete</option><option>Pending</option><option>Cancelled</option></select></div><p class="text-xs text-gray-500 pt-2">Note: Contributions to goals/investments are recorded as expenses.</p><div class="flex justify-end gap-4 mt-6"><button type="button" class="modal-cancel px-4 py-2 rounded-lg">Cancel</button><button type="submit" class="bg-teal-500 px-4 py-2 rounded-lg">Add</button></div></form>`;},
                addGoalForm: () => `<form id="modal-form"><div class="space-y-4"><input name="name" required placeholder="Goal Name" class="w-full bg-gray-700 p-3 rounded-lg"><input name="target" type="number" required placeholder="Target Amount" class="w-full bg-gray-700 p-3 rounded-lg"><input name="saved" type="number" value="0" placeholder="Initial Saved Amount" class="w-full bg-gray-700 p-3 rounded-lg"></div><div class="flex justify-end gap-4 mt-6"><button type="button" class="modal-cancel px-4 py-2 rounded-lg">Cancel</button><button type="submit" class="bg-teal-500 px-4 py-2 rounded-lg">Set Goal</button></div></form>`,
                addInvestmentForm: () => `<form id="modal-form"><div class="space-y-4"><input name="name" required placeholder="e.g., Tata Motors" class="w-full bg-gray-700 p-3 rounded-lg"><select name="type" required class="w-full bg-gray-700 p-3 rounded-lg"><option>Stocks</option><option>Mutual Funds</option><option>Gold</option><option>Crypto</option><option>Other</option></select><input name="amount" type="number" step="0.01" value="0" required placeholder="Initial Amount Invested" class="w-full bg-gray-700 p-3 rounded-lg"></div><div class="flex justify-end gap-4 mt-6"><button type="button" class="modal-cancel px-4 py-2 rounded-lg">Cancel</button><button type="submit" class="bg-teal-500 px-4 py-2 rounded-lg">Add</button></div></form>`,
                addPlannerEventForm: () => `<form id="modal-form"><div class="space-y-4"><input name="title" required placeholder="e.g., Credit Card Bill Due" class="w-full bg-gray-700 p-3 rounded-lg"><input name="date" type="date" required class="w-full bg-gray-700 p-3 rounded-lg text-gray-400" value="${new Date().toISOString().slice(0,10)}"></div><div class="flex justify-end gap-4 mt-6"><button type="button" class="modal-cancel px-4 py-2 rounded-lg">Cancel</button><button type="submit" class="bg-teal-500 px-4 py-2 rounded-lg">Schedule</button></div></form>`,
                importExcelModal: () => `<div id="import-excel-content"><p class="mb-4 text-gray-400">Upload a MS Excel (.xlsx, .xls) file. The system will auto-detect the format.</p><div class="bg-gray-700 p-3 rounded-lg text-sm mb-4"><p class="font-bold text-teal-400">Supported Columns:</p><p class="text-xs text-gray-400">Time/Date, Description, Amount, Category, Type, Status, Transaction ID, Product, Payment method</p></div><div class="mb-6"><label for="file-upload-input" class="w-full text-center cursor-pointer bg-blue-600 p-3 rounded-lg font-semibold hover:bg-blue-700 block">Choose File</label><input type="file" id="file-upload-input" class="hidden" accept=".xlsx, .xls"><p id="file-name-display" class="text-sm text-center mt-2 text-gray-400">No file chosen</p></div><div id="import-status" class="text-center h-5"></div><div class="flex justify-between items-center mt-6"><a href="${templates.getSampleXlsxDataUri()}" download="transactions_template.xlsx" class="text-sm text-teal-400 hover:underline">Download Template</a><div><button type="button" class="modal-cancel px-4 py-2 rounded-lg">Cancel</button><button type="button" id="upload-file-btn" disabled class="bg-gray-500 cursor-not-allowed px-4 py-2 rounded-lg ml-2">Upload</button></div></div></div>`,
                getSampleXlsxDataUri: () => { const data = [["Date", "Transaction ID", "Description", "Product", "Payment Method", "Status", "Amount", "Category", "Type"],["2025-10-05", "GPA.1234-5678", "Monthly Salary", "N/A", "Bank Transfer", "Complete", 75000, "Salary", "income"],["2025-10-06", "XYZ-9876", "Groceries", "Milk, Bread, etc.", "UPI", "Complete", 3500, "Groceries", "expense"]]; const ws = XLSX.utils.aoa_to_sheet(data); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Transactions"); const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'base64' }); return `data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,${wbout}`; },
                confirmationModal: (title, message) => `<div><p class="text-gray-300 mb-6">${message}</p><div class="flex justify-end gap-4"><button type="button" class="modal-cancel px-4 py-2 rounded-lg">Cancel</button><button type="button" id="confirm-action-btn" class="bg-red-600 px-4 py-2 rounded-lg text-white hover:bg-red-700">Confirm</button></div></div>`,
                aiGoalPlannerModal: () => `
                    <div id="ai-goal-planner-content">
                        <div id="ai-goal-input-view">
                            <p class="text-gray-400 mb-4">Describe your savings goal in plain English. Include the item and its approximate cost.</p>
                            <textarea id="ai-goal-input" class="w-full bg-gray-700 p-3 rounded-lg h-24" placeholder="e.g., I want to save for a new Royal Enfield bike that costs around 2,50,000"></textarea>
                            <div class="flex justify-end gap-4 mt-6">
                                <button type="button" class="modal-cancel px-4 py-2 rounded-lg">Cancel</button>
                                <button type="button" id="generate-plan-btn" class="bg-indigo-600 px-4 py-2 rounded-lg">Generate Plan</button>
                            </div>
                        </div>
                        <div id="ai-goal-loading-view" class="hidden text-center text-gray-400">
                            <p>✨ Analyzing your goal and creating a plan...</p>
                        </div>
                        <div id="ai-goal-result-view" class="hidden">
                            <!-- Results will be injected here -->
                        </div>
                    </div>
                `
            };

            // ========================================================================
            // 6. MAIN RENDER & EVENT HANDLING
            // ========================================================================
            
            const handleFileUpload = (file) => {
                const reader = new FileReader();
                const statusEl = document.getElementById('import-status');
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array', cellDates: true, dateNF:'YYYY-MM-DD' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet, { raw: false });

                        if (jsonData.length === 0) throw new Error("File is empty or format is incorrect.");
                        
                        const transactions = jsonData.map(row => {
                            let mappedRow = {};
                            let dateStr = row.Time || row.Date;
                            if (!dateStr) return null;
                            
                            let dateObj = new Date(String(dateStr).replace(/,/g, '').replace('â€¯', ' '));
                            if (isNaN(dateObj.getTime())) return null;

                            const headers = Object.keys(row);
                            const hasTypeColumn = headers.includes('Type');

                            mappedRow = {
                                date: dateObj.toISOString().slice(0, 10),
                                transactionId: row['Transaction ID'] || '',
                                description: row.Description || 'N/A',
                                product: row.Product || '',
                                paymentMethod: row['Payment method'] || row['Payment Method'] || 'Other',
                                status: row.Status || 'Complete',
                                amount: parseFloat(String(row.Amount || '0').replace(/[^\d.-]/g, '')) || 0,
                                category: row.Category || row.Product || 'Uncategorized',
                                type: hasTypeColumn ? String(row.Type).toLowerCase() : 'expense', // Smart Type Detection
                            };
                            
                            if (!mappedRow.date || !mappedRow.description || isNaN(mappedRow.amount)) return null;
                            return mappedRow;

                        }).filter(Boolean);

                        if (transactions.length > 0) {
                            api.addMultipleTransactions(transactions);
                            statusEl.textContent = `Successfully imported ${transactions.length} transactions.`;
                            statusEl.className = "text-green-400";
                            setTimeout(() => { document.querySelector('.modal-cancel')?.click(); renderPageContent(); }, 1500);
                        } else { 
                            throw new Error("No valid transactions could be processed from the file.");
                        }
                    } catch (error) {
                        statusEl.textContent = `Error: ${error.message}`;
                        statusEl.className = "text-red-400";
                    }
                };
                reader.onerror = () => {
                    statusEl.textContent = 'Error reading the file.';
                    statusEl.className = "text-red-400";
                };
                reader.readAsArrayBuffer(file);
            };

            const showModal = (title, formTemplate, onConfirm) => {
                const modalContainer = document.getElementById('modal-container');
                modalContainer.innerHTML = templates.modalShell(title, formTemplate);
                modalContainer.style.display = 'block';

                const closeModal = () => { modalContainer.style.display = 'none'; modalContainer.innerHTML = ''; };

                modalContainer.addEventListener('click', e => { if (e.target.classList.contains('modal-cancel') || e.target.classList.contains('modal-backdrop')) closeModal(); });

                const form = modalContainer.querySelector('#modal-form');
                if (form) {
                    form.addEventListener('submit', e => {
                        e.preventDefault();
                        const formData = Object.fromEntries(new FormData(e.target).entries());
                        if (onConfirm) onConfirm(formData);
                        closeModal();
                        renderPageContent();
                    });
                }
                
                const confirmBtn = modalContainer.querySelector('#confirm-action-btn');
                if (confirmBtn) {
                    confirmBtn.addEventListener('click', () => {
                        if (onConfirm) onConfirm();
                        closeModal();
                        renderPageContent();
                    });
                }

                const importContent = modalContainer.querySelector('#import-excel-content');
                if (importContent) {
                    const fileInput = importContent.querySelector('#file-upload-input');
                    const fileNameDisplay = importContent.querySelector('#file-name-display');
                    const uploadBtn = importContent.querySelector('#upload-file-btn');
                    let selectedFile = null;
                    fileInput.addEventListener('change', e => {
                        selectedFile = e.target.files[0];
                        if(selectedFile) {
                            fileNameDisplay.textContent = selectedFile.name;
                            uploadBtn.disabled = false;
                            uploadBtn.classList.remove('bg-gray-500', 'cursor-not-allowed');
                            uploadBtn.classList.add('bg-teal-500', 'hover:bg-teal-600');
                        }
                    });
                    uploadBtn.addEventListener('click', () => { if (selectedFile) handleFileUpload(selectedFile); });
                }

                const aiGoalPlanner = modalContainer.querySelector('#ai-goal-planner-content');
                if (aiGoalPlanner) {
                    const inputView = aiGoalPlanner.querySelector('#ai-goal-input-view');
                    const loadingView = aiGoalPlanner.querySelector('#ai-goal-loading-view');
                    const resultView = aiGoalPlanner.querySelector('#ai-goal-result-view');
                    
                    aiGoalPlanner.querySelector('#generate-plan-btn').addEventListener('click', async () => {
                        const userInput = aiGoalPlanner.querySelector('#ai-goal-input').value;
                        if (!userInput.trim()) return;

                        inputView.style.display = 'none';
                        loadingView.style.display = 'block';

                        const result = await helpers.getAIGoalPlan(userInput);
                        
                        loadingView.style.display = 'none';
                        
                        if (result) {
                            resultView.style.display = 'block';
                            resultView.innerHTML = `
                                <h4 class="font-bold text-lg text-white">Suggested Plan: ${result.goalName}</h4>
                                <p class="text-2xl font-bold text-teal-400 my-2">₹${result.targetAmount.toLocaleString('en-IN')}</p>
                                <p class="text-gray-400 mb-6">${result.plan}</p>
                                <div class="flex justify-end gap-4">
                                    <button type="button" class="modal-cancel px-4 py-2 rounded-lg">Cancel</button>
                                    <button type="button" id="add-ai-goal-btn" class="bg-teal-500 px-4 py-2 rounded-lg">Add this Goal</button>
                                </div>
                            `;
                            resultView.querySelector('#add-ai-goal-btn').addEventListener('click', () => {
                                api.addItem('goals', { name: result.goalName, target: result.targetAmount, saved: 0 });
                                closeModal();
                                renderPageContent();
                            });
                        } else {
                            resultView.style.display = 'block';
                            resultView.innerHTML = `<p class="text-red-400 text-center">Sorry, couldn't generate a plan. Please try again.</p><div class="flex justify-end mt-4"><button type="button" class="modal-cancel px-4 py-2 rounded-lg">Close</button></div>`;
                        }
                    });
                }
            };

            const renderPageContent = () => {
                const pageContainer = document.getElementById('page-container');
                const pageTitle = document.getElementById('page-title');
                if(!pageContainer || !pageTitle) return;
                
                pageContainer.style.opacity = 0;

                setTimeout(() => {
                    pageTitle.textContent = state.currentPage;
                    const userData = db.getUserData(state.currentUser);
                    const pageRenderers = { 'Dashboard': templates.dashboardPage, 'Transactions': templates.transactionsPage, 'Goals': templates.goalsPage, 'Investments': templates.investmentsPage, 'Planner': templates.plannerPage, 'Reports': templates.reportsPage, 'Insights': templates.insightsPage };
                    const renderer = pageRenderers[state.currentPage];
                    if (renderer) {
                        const dataMap = { 'Dashboard': userData, 'Transactions': userData.transactions, 'Goals': userData.goals, 'Investments': userData.investments, 'Planner': userData.plannerEvents, 'Reports': userData, 'Insights': null };
                        pageContainer.innerHTML = renderer(dataMap[state.currentPage]);
                    } else {
                        pageContainer.innerHTML = `<div class="text-center p-8">Page coming soon!</div>`;
                    }
                    if (state.currentPage === 'Dashboard' || state.currentPage === 'Reports') {
                        const prefix = state.currentPage.toLowerCase();
                        helpers.renderLineChart(`${prefix}-line-chart`, userData.transactions);
                        helpers.renderPieChart(`${prefix}-pie-chart`, userData.transactions);
                    }
                    updateActiveNavLink();
                    pageContainer.style.opacity = 1;
                }, 200);
            };

            const bindAppEvents = () => {
                const appContainer = document.getElementById('app-container');
                if (!appContainer) return;

                appContainer.addEventListener('click', e => {
                    // Mobile menu toggle
                    const menuToggle = e.target.closest('#menu-toggle-btn');
                    const sidebar = document.getElementById('sidebar');
                    const sidebarOverlay = document.getElementById('sidebar-overlay');
                    if (menuToggle) {
                        sidebar.classList.toggle('-translate-x-full');
                        sidebarOverlay.classList.toggle('hidden');
                    }
                    if (sidebarOverlay && !sidebarOverlay.classList.contains('hidden') && e.target === sidebarOverlay) {
                        sidebar.classList.add('-translate-x-full');
                        sidebarOverlay.classList.add('hidden');
                    }

                    const logoutButton = e.target.closest('#logout-button');
                    const resetButton = e.target.closest('#reset-data-button');
                    const navLink = e.target.closest('.nav-link');
                    const plannerCheckbox = e.target.closest('.planner-checkbox');
                    const addTransactionBtn = e.target.closest('#add-transaction-btn');
                    const importExcelBtn = e.target.closest('#import-excel-btn');
                    const addGoalBtn = e.target.closest('#add-goal-btn');
                    const planGoalAIBtn = e.target.closest('#plan-goal-ai-btn');
                    const addInvestmentBtn = e.target.closest('#add-investment-btn');
                    const addPlannerBtn = e.target.closest('#add-planner-event-btn');
                    const getAiReportBtn = e.target.closest('#get-ai-report-btn');

                    if (logoutButton) auth.logout();
                    
                    if (resetButton) {
                        showModal('Confirm Data Reset', templates.confirmationModal('Confirm Reset', 'Are you sure you want to delete all your data? This action cannot be undone.'), () => {
                            api.resetUserData();
                            helpers.showNotification('All data has been reset.', 'success');
                        });
                    }
                    
                    if (navLink) { 
                        e.preventDefault(); 
                        state.currentPage = navLink.dataset.page; 
                        renderPageContent(); 
                        // Close mobile menu on navigation
                        if (sidebar && window.innerWidth < 1024) {
                            sidebar.classList.add('-translate-x-full');
                            sidebarOverlay.classList.add('hidden');
                        }
                    }
                    
                    if (plannerCheckbox) {
                        const eventId = Number(plannerCheckbox.dataset.id);
                        api.togglePlannerEventDone(eventId);
                        renderPageContent();
                    }
                    
                    const userData = db.getUserData(state.currentUser);
                    if (addTransactionBtn) showModal('Add New Transaction', templates.addTransactionForm(userData), (formData) => api.addItem('transactions', formData));
                    if (importExcelBtn) showModal(null, templates.importExcelModal());
                    if (addGoalBtn) showModal('Set New Goal', templates.addGoalForm(), (formData) => api.addItem('goals', formData));
                    if (planGoalAIBtn) showModal('Plan Goal with AI', templates.aiGoalPlannerModal());
                    if (addInvestmentBtn) showModal('Add New Investment', templates.addInvestmentForm(), (formData) => api.addItem('investments', formData));
                    if (addPlannerBtn) showModal('Add New Event', templates.addPlannerEventForm(), (formData) => api.addItem('plannerEvents', formData));
                    if (getAiReportBtn) helpers.getAIFinancialReport();
                });
            };
            
            const renderAuthPage = (templateFn) => {
                document.getElementById('auth-container').innerHTML = templateFn();
                const authContainer = document.getElementById('auth-container');
                const loginForm = authContainer.querySelector('#login-form');
                const registerForm = authContainer.querySelector('#register-form');
                const showRegisterLink = authContainer.querySelector('#show-register');
                const showLoginLink = authContainer.querySelector('#show-login');
                if (loginForm) loginForm.addEventListener('submit', e => { e.preventDefault(); const email = loginForm.querySelector('#login-email').value; const password = loginForm.querySelector('#login-password').value; if (auth.login(email, password)) { renderApp(); } else { loginForm.querySelector('#login-error').textContent = 'Invalid credentials'; } });
                if (registerForm) registerForm.addEventListener('submit', e => { e.preventDefault(); const name = registerForm.querySelector('#register-name').value; const email = registerForm.querySelector('#register-email').value; const password = registerForm.querySelector('#register-password').value; if (auth.register(name, email, password)) { renderApp(); } else { registerForm.querySelector('#register-error').textContent = 'Email already in use'; } });
                if (showRegisterLink) showRegisterLink.addEventListener('click', e => { e.preventDefault(); renderAuthPage(templates.registerPage); });
                if (showLoginLink) showLoginLink.addEventListener('click', e => { e.preventDefault(); renderAuthPage(templates.loginPage); });
            };

            const updateActiveNavLink = () => {
                document.querySelectorAll('.nav-link').forEach(link => {
                    link.classList.toggle('bg-teal-600', link.dataset.page === state.currentPage);
                    link.classList.toggle('text-white', link.dataset.page === state.currentPage);
                    link.classList.toggle('text-gray-400', link.dataset.page !== state.currentPage);
                    link.classList.toggle('hover:bg-gray-700', link.dataset.page !== state.currentPage);
                });
            };

            const renderApp = () => {
                const appContainer = document.getElementById('app-container');
                const authContainer = document.getElementById('auth-container');
                if (state.currentUser) {
                    authContainer.style.display = 'none';
                    appContainer.classList.remove('hidden');
                    appContainer.innerHTML = templates.mainAppShell(db.getUsers()[state.currentUser]?.name || 'User');
                    bindAppEvents();
                    renderPageContent();
                } else {
                    appContainer.classList.add('hidden');
                    authContainer.style.display = 'flex';
                    renderAuthPage(templates.loginPage);
                }
            };
            
            // ========================================================================
            // 7. INITIALIZATION
            // ========================================================================
            db.init();
            auth.checkSession();
            renderApp();

        });
    </script>
</body>
</html>
